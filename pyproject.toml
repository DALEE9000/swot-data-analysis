[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swotxai"
version = "0.1.0"
description = "Machine learning with SWOT + high-frequency radar data analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "David A. Lee", email = "dal2183@columbia.edu" }
]

# Core runtime dependencies inferred from your code
dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "matplotlib",
  "scikit-learn",
  "scipy",
  "geopandas",
  "shapely",
  "paramiko",
  "cartopy",
  "cmocean",
  "xrft",
  "requests",
  "python-dotenv",
  "s3fs",
  "aiobotocore[boto3]",
  "h5py",
  "h5netcdf",
  "netCDF4",
  "pyyaml",
  "tqdm",
  "pillow",
  "streamlit>=1.35",
  "plotly>=5",
  "imageio[ffmpeg]"
]

[project.optional-dependencies]
# Random-forest backend (swotxai.models.rf). sklearn (core) is the CPU
# fallback; lightgbm adds the GPU-capable backend. cuML must be installed
# separately via RAPIDS.
rf = [
  "lightgbm"
]
# Neural-network backend (swotxai.models.ann). For a CUDA build of torch use:
#   pip install torch --index-url https://download.pytorch.org/whl/cu126
ann = [
  "torch"
]
# AlphaEvolve-style code evolution (swotxai.evolve + scripts/evolve.py).
# Requires the ann extra too; the Claude API key stays in the parent process.
evolve = [
  "anthropic"
]
dev = [
  "ipykernel",
  "jupyterlab",
  "pytest",
  "black",
  "isort",
  "mypy"
]

[project.scripts]
swotxai-gui = "streamlit.web.cli:main_run_clize"

[tool.setuptools.packages.find]
where = ["src"]