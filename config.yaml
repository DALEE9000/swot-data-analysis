# SWOTxAI configuration
# Copy this file and edit paths for your setup, then load it in the GUI sidebar.

# ---------------------------------------------------------------------------
# Data sources — LOCAL repo mirrors (experiments/ mirrors s3://swot-ai-ssv 1:1).
# Pre-built pkls load directly; raw-source fallbacks are only touched when a
# pkl is missing (S3 fallbacks cost egress — see the cost rule in CLAUDE.md).
# ---------------------------------------------------------------------------
swot_pkl_path: "experiments/uswc/swot_cycles/swot_expert_reproc_v3_calval_uswc_474_578.pkl"
hfr_pkl_path:  "experiments/uswc/hfr_target/hfr_calval_uswc.pkl"
era5_pkl_path: "experiments/uswc/era5/era5wind_calval_uswc_10m.pkl"
goes_nc_path:  "experiments/uswc/goes/goes_sst_calval_uswc.nc"
# raw-source fallbacks (used only if the pkls above are missing):
swot_path: "s3://swot-ai-ssv/SWOT_L3/calval/Expert_reproc_v3_uswc_calval"
hfr_path:  "s3://swot-ai-ssv/HFR/uswc/uswc_6km_Resolution_hourly_2012_2024.nc4"

# ---------------------------------------------------------------------------
# Domain — bounding box [longitude, latitude] (full uswc network footprint)
# ---------------------------------------------------------------------------
sw_corner: [-126.8, 31.2]   # southwest corner [lon, lat]
ne_corner:  [-116.6, 49.9]  # northeast corner  [lon, lat]
region: "uswc"              # routes weights/inference into experiments/uswc/

# ---------------------------------------------------------------------------
# Mission phase
# calval: 1-day repeat calibration/validation phase (cycles 474-578)
# science: 21-day science phase (cycles 1-16)
# ---------------------------------------------------------------------------
mission: "calval"
sph_calval_path: "orbit_data/sph_calval_swath.zip"
sph_science_path: "orbit_data/sph_science_swath.zip"

# ---------------------------------------------------------------------------
# Model backend
# rf:  random forest (swotxai.models.rf — sklearn / cuML / LightGBM)
# ann: artificial neural network (swotxai.models.ann — PyTorch MLP)
# ---------------------------------------------------------------------------
model: "rf"

# ---------------------------------------------------------------------------
# Input features (shared by both backends)
# Available: mdt, ssha_filtered, ugos_filtered, vgos_filtered,
#            ugosa_filtered, vgosa_filtered, era5_u, era5_v, SST
# ---------------------------------------------------------------------------
features:
  - mdt
  - ssha_filtered
  - ugos_filtered
  - vgos_filtered
  - ugosa_filtered
  - vgosa_filtered
  - era5_u
  - era5_v
  - SST

# --- Shared ML settings ---
stencil_k:    3     # spatial context window size (must be odd: 1, 3, 5, 7)
random_state: 42

# ---------------------------------------------------------------------------
# Random-forest hyperparameters (used when model: "rf")
# ---------------------------------------------------------------------------
rf_n_estimators: 50
rf_max_depth:    15
rf_use_gpu:      true    # cuML RandomForest (requires NVIDIA GPU + RAPIDS)
rf_use_lgbm:     false   # LightGBM GPU RandomForest fallback

# ---------------------------------------------------------------------------
# ANN hyperparameters (used when model: "ann")
# ---------------------------------------------------------------------------
ann_hidden_layers: [256, 256, 128]  # MLP hidden-layer widths
ann_activation:    "silu"           # silu | relu | gelu | tanh
ann_dropout:       0.1
ann_lr:            0.001
ann_weight_decay:  0.0001
ann_batch_size:    4096
ann_max_epochs:    200
ann_patience:      15               # early stopping (epochs without val improvement)
ann_val_fraction:  0.1
ann_device:        "auto"           # "auto" | "cuda" | "cpu"

# ---------------------------------------------------------------------------
# Animation
# ---------------------------------------------------------------------------
cycles_start: 474
cycles_end:   578
frame_dir:    ""            # blank → auto: frames/[region/]{model}/{experiment_id}
animation_output: ""        # blank → auto: animations/[region/]{model}/{experiment_id}
fps:  8
dpi:  150

# ---------------------------------------------------------------------------
# Caching — intermediate results are pickled here to avoid recomputation.
# Model weights and inference outputs are partitioned per backend
# (…/rf/… vs …/ann/…).
# ---------------------------------------------------------------------------
cache_dir: "cache"
run_id: ""        # optional — short name (letters/digits/_/- only) that keys cached weights so
                  # later runs reuse them; blank → each run is keyed by its unique experiment ID
